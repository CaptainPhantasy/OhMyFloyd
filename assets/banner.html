<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Floyd Logo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
    }
    .logo-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(135deg, #0a0a0f 0%, #12121a 50%, #0a0a0f 100%);
      overflow: hidden;
    }
    .grid {
      position: absolute;
      inset: 0;
      opacity: 0.03;
      background-image:
        linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
    }
    .ascii-container {
      font-size: 14px;
      line-height: 1.2;
      text-align: center;
      margin-bottom: 24px;
      color: #f0f0f0;
    }
    .ascii-title {
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 0.2em;
      margin-bottom: 16px;
      background: linear-gradient(90deg, #ff61dc, #61dcff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .ascii-art {
      font-family: 'Courier New', monospace;
      white-space: pre;
      line-height: 1.1;
    }
    .ascii-line-1 { color: #ff61dc; }
    .ascii-line-2 { color: #e85fcf; }
    .ascii-line-3 { color: #d15dc2; }
    .ascii-line-4 { color: #ba5ab4; }
    .ascii-line-5 { color: #a358a7; }
    .ascii-line-6 { color: #8c559a; }
    .ascii-line-7 { color: #75538d; }
    .tagline {
      display: flex;
      align-items: center;
      gap: 12px;
      color: rgba(255,255,255,0.4);
      font-size: 14px;
      letter-spacing: 0.4em;
      text-transform: uppercase;
    }
    .tagline .bracket { font-size: 18px; font-weight: 300; color: rgba(255,255,255,0.3); }
    .status {
      margin-top: 24px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: rgba(255,255,255,0.3);
      letter-spacing: 0.05em;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .corner {
      position: absolute;
      width: 32px;
      height: 32px;
      border-color: rgba(255,255,255,0.1);
      border-style: solid;
      border-width: 0;
    }
    .corner.tl { top: 16px; left: 16px; border-top-width: 2px; border-left-width: 2px; }
    .corner.tr { top: 16px; right: 16px; border-top-width: 2px; border-right-width: 2px; }
    .corner.bl { bottom: 16px; left: 16px; border-bottom-width: 2px; border-left-width: 2px; }
    .corner.br { bottom: 16px; right: 16px; border-bottom-width: 2px; border-right-width: 2px; }
  </style>
</head>
<body>
  <div class="logo-container">
    <div class="grid"></div>
    <div class="content">
      <div class="ascii-container">
        <div class="ascii-title">Legacy AI & Floyd's Labs</div>
        <div class="ascii-art">
<span class="ascii-line-1">░█▀▀░█░░░█▀█░█░█░█▀▄</span>
<span class="ascii-line-2">░█▀▀░█░░░█░█░░█░░█░█</span>
<span class="ascii-line-3">░▀░░░▀▀▀░▀▀▀░░▀░░▀▀░</span>
<span class="ascii-line-4">░█▀▀░█▀█░█▀▄░█▀▀░░░░</span>
<span class="ascii-line-5">░█░░░█░█░█░█░█▀▀░░░░</span>
<span class="ascii-line-6">░▀▀▀░▀▀▀░▀▀░░▀▀▀░░░░</span>
        </div>
      </div>
      <div class="tagline">
        <span class="bracket">[</span>
        <span>AI Coding Agent</span>
        <span class="bracket">]</span>
      </div>
      <div class="status">
        <div class="status-dot"></div>
        <span>MCP · LSP · Subagents · Web Search</span>
      </div>
    </div>
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
  </div>
</body>
</html>
